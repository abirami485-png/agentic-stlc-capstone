name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
          SECRET_SAUCE_PASSWORD: ${{ secrets.SECRET_SAUCE_PASSWORD }}
          DEFAULT_FIRST_NAME: ${{ secrets.DEFAULT_FIRST_NAME }}
          DEFAULT_LAST_NAME: ${{ secrets.DEFAULT_LAST_NAME }}
          DEFAULT_POSTAL_CODE: ${{ secrets.DEFAULT_POSTAL_CODE }}
